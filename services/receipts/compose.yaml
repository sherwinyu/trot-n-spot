services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bowl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      POSTGRES_DB: bowl
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bowl -d bowl']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ../..
      dockerfile: services/receipts/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://bowl:${POSTGRES_PASSWORD}@db:5432/bowl
    command: ['node', '--import', 'tsx', 'src/migrate.ts']
    depends_on:
      db: { condition: service_healthy }
  api:
    build:
      context: ../..
      dockerfile: services/receipts/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://bowl:${POSTGRES_PASSWORD}@db:5432/bowl
      STORAGE_DIR: /data/images
    volumes: ['images:/data/images']
    ports: ['3001:3001']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    build:
      context: ../..
      dockerfile: services/receipts/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://bowl:${POSTGRES_PASSWORD}@db:5432/bowl
      STORAGE_DIR: /data/images
    command: ['node', '--import', 'tsx', 'src/worker-main.ts']
    volumes: ['images:/data/images']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  postgres:
  images:
