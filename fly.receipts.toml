app = "trotnspot-receipts"
primary_region = "sea"
kill_signal = "SIGTERM"
kill_timeout = 150

[build]
  dockerfile = "services/receipts/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  OPENAI_MODEL = "gpt-4.1-mini"
  CORS_ORIGINS = ""

[processes]
  api = "node --import tsx src/main.ts"
  worker = "node --import tsx src/worker-main.ts"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["api"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
