# Full smoke test: sign in, browse feed, open a quest, check history,
# start/end a walk. Photo capture flows (create/complete) are covered by
# the web E2E suite (e2e/run-e2e.js) — the system camera can't be driven
# reliably from Maestro on an emulator.
#
# Prereqs: local Supabase running with seed data (npx supabase db reset),
# app built with dev env vars, emulator/device connected, Metro running.
#
# The app ships as an Expo dev client, so a bare `launchApp` lands on the dev
# launcher rather than the app. Clear state, then deep-link straight to the
# Metro bundler (the Android emulator reaches the host at 10.0.2.2:8081) so the
# client connects deterministically without depending on launcher auto-detect.
appId: com.trotnspot.quest
---
- launchApp:
    clearState: true
- stopApp
- openLink: 'quest://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081'
# Deep-linking into the dev client opens its developer menu over the app;
# wait for it (first bundle is slow), advance past the intro, and close it.
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 120000
- tapOn: 'Continue'
- back
- extendedWaitUntil:
    visible: 'DEV LOGIN'
    timeout: 30000

# Dev email login (prefilled in __DEV__ builds)
- tapOn: 'Sign In / Sign Up'

# Feed
- assertVisible: 'Quests for You'
- assertVisible: 'Find this cool mural on Oak Street'

# Quest detail (assignee view — location must not be shown)
- tapOn: 'Find this cool mural on Oak Street'
- assertVisible: 'I Found It!'
- assertNotVisible: 'Spotted at'
- back

# History (completed quests load asynchronously; text is "Found in 4 hours"
# etc., so match as a regex — Maestro selectors are full-string regexes).
- tapOn: 'History'
- extendedWaitUntil:
    visible: 'Found in .*'
    timeout: 60000

# Journey start/end
- tapOn: 'Profile'
- tapOn: 'Start Walk'
- assertVisible: 'End Walk'
- tapOn: 'End Walk'
- assertVisible: 'Start Walk'
